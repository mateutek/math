<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- 32x32, not "any": with "any" Chrome takes the .ico over the sharper SVG -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Liczbowo</title>
    <meta name="description" content="Matematyka, która buduje wioskę">
    <meta property="og:title" content="Liczbowo">
    <meta property="og:description" content="Matematyka, która buduje wioskę">
    <meta property="og:type" content="website">
    <!-- link previews (Facebook, X, Messenger, Slack...) need an absolute URL;
         the card is public/og.png, /en swaps in og-en.png (see vite.config.js) -->
    <meta property="og:image" content="https://matematyka-sp.netlify.app/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Liczbowo - matematyka, która buduje wioskę">
    <meta name="twitter:card" content="summary_large_image">
    <!-- set the theme before the first paint so night never flashes day -->
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t !== 'day' && t !== 'night') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
            }
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <!-- Geist and Geist Mono are self-hosted from public/fonts, see src/assets/design/fonts.css -->
    <link rel="preload" href="/fonts/geist-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Google Analytics loads from src/analytics.js, only after a parent
         consents through ConsentBanner.vue - see src/main.js / src/App.vue -->
</head>
<body>
<noscript>
    <strong>We're sorry but Liczbowo doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
</noscript>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
