<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- 32x32, not "any": with "any" Chrome takes the .ico over the sharper SVG -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Liczbowo</title>
    <meta name="description" content="Matematyka, która buduje wioskę">
    <meta property="og:title" content="Liczbowo">
    <meta property="og:description" content="Matematyka, która buduje wioskę">
    <meta property="og:type" content="website">
    <!-- set the theme before the first paint so night never flashes day -->
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t !== 'day' && t !== 'night') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
            }
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Analytics loads from src/analytics.js, only after a parent
         consents through ConsentBanner.vue - see src/main.js / src/App.vue -->
</head>
<body>
<noscript>
    <strong>We're sorry but Liczbowo doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
</noscript>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
